customCommands:
  - key: "c"
    context: "files"
    description: "Conventional commit"
    loadingText: "Committing..."
    prompts:
      - type: "menu"
        title: "Commit type"
        key: "Type"
        options:
          - name: "feat"
            description: "A new feature"
            value: "feat"
          - name: "fix"
            description: "A bug fix"
            value: "fix"
          - name: "chore"
            description: "Other changes that don't modify src or test files"
            value: "chore"
          - name: "docs"
            description: "Documentation only changes"
            value: "docs"
          - name: "refactor"
            description: "Code change that neither fixes a bug nor adds a feature"
            value: "refactor"
          - name: "style"
            description: "Formatting, whitespace, no code change"
            value: "style"
          - name: "perf"
            description: "Performance improvement"
            value: "perf"
          - name: "test"
            description: "Adding or fixing tests"
            value: "test"
          - name: "build"
            description: "Build system or external dependencies"
            value: "build"
          - name: "ci"
            description: "CI configuration"
            value: "ci"
          - name: "revert"
            description: "Revert a previous commit"
            value: "revert"
      - type: "input"
        title: "Scope (leave empty to skip)"
        key: "Scope"
      - type: "input"
        title: "Commit message"
        key: "Message"
    command: 'git commit -m "{{.Form.Type}}{{ if .Form.Scope }}({{ .Form.Scope }}){{ end }}: {{ .Form.Message }}"'

  - key: "C"
    context: "files"
    description: "Quick commit (plain message)"
    loadingText: "Committing..."
    prompts:
      - type: "input"
        title: "Commit message"
        key: "Message"
    command: 'git commit -m "{{ .Form.Message }}"'
