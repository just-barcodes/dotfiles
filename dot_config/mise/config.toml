# Tools installed on every `chezmoi apply` (run_onchange_mise_installs.sh).
# Keep this to what the dotfiles themselves need: shell hooks, nvim plugins,
# scripts. Everything else lives in .chezmoidata/mise.yaml and is picked
# with `misepick`. Renovate bumps the pins here (see renovate.json).
[tools]
# Editors / fast-moving CLIs (kept current via mise instead of apt LTS)
"aqua:neovim/neovim" = "latest"

# Shell history sync
atuin = "latest"

# Files
yazi = "26" # zshrc alias, tui-launcher
