# tmux status bar colours. Rendered per theme by
# .chezmoiscripts/run_onchange_after_render_themes.sh.tmpl into
# ~/.config/theme/generated/<name>/tmux.conf, which ~/.tmux.conf sources.
#
# One template, every theme: `${key}` names a key in the palette .env. envsubst
# is called with an explicit variable list, so tmux's own `#{...}` formats and
# the `$1`/`$2`/`$3` awk fields below pass through untouched.
#
# Layout (position, interval, lengths, pane-border-lines) stays in
# dot_tmux.conf.tmpl -- only colour-bearing options live here.

set -g status-style "bg=${bg_0},fg=${fg_0}"
# Clear deprecated options that would otherwise override status-style.
set -gu status-bg
set -gu status-fg
set -g pane-border-style "fg=${bg_2}"
set -g pane-active-border-style "fg=${cyan}"

# Message / mode styling
set -g message-style "bg=${yellow},fg=${bg_0},bold"
set -g mode-style "bg=${cyan},fg=${bg_0},bold"

# Line 1 (top) — session, host, git, sys, clock
set -g status-format[1] "#[bg=${bg_1},fg=${red},bold] #S#[bg=${bg_0},fg=${bg_1}]#[fg=${dim_0}]  #h #[fg=${bg_2}]│#[fg=${cyan}]  #(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo -) #[align=right,bg=${bg_0}]#[fg=${dim_0}]  #(cut -d' ' -f1 /proc/loadavg) #[fg=${bg_2}]│#[fg=${green}]  #(free -h | awk '/^Mem:/{print $3\"/\"$2}') #[fg=${bg_2}]│#[fg=${orange}] #(awk '{print $0\"%\"}' /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo -)  #[bg=${bg_1},fg=${bg_0}]#[bg=${bg_1},fg=${fg_1}]  %a %b %d #[bg=${yellow},fg=${bg_1}]#[bg=${yellow},fg=${bg_0},bold]  %H:%M "
set -g status-right "#[fg=${cyan}] #{devcontainers_workspace} #[fg=${dim_0}]#{devcontainers_status} #[fg=${bg_2}]│#[fg=${dim_0}]  #{b:pane_current_path} "

setw -g window-status-separator "#[bg=${bg_0},fg=${bg_2}] · "
setw -g window-status-format "#[bg=${bg_1},fg=${dim_0}] #I #[fg=${fg_1}]#W "
setw -g window-status-current-format "#[bg=${bg_0},fg=${yellow}]#[bg=${yellow},fg=${bg_0},bold] #I #W #[bg=${bg_0},fg=${yellow}]"
setw -g window-status-style "bg=${bg_0},fg=${fg_1}"
setw -g window-status-current-style "bg=${yellow},fg=${bg_0},bold"
setw -g window-status-activity-style "fg=${yellow},blink"
setw -g window-status-bell-style "fg=${red},bold"
