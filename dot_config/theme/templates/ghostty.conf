# Rendered per theme from the palette .env. Themes live in ~/.config/theme/palettes.
# Do not edit the generated copy.
#
# This replaces the `theme = light:X,dark:Y` shorthand, which can only ever
# name one light and one dark theme and so cannot choose between two dark
# themes. Ghostty reloads on SIGUSR2, which theme-switch sends.
theme = ${ghostty_theme}
