"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$os\
$jobs\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_commit\
$git_state\
$git_status\
[](fg:color_aqua bg:color_yellow)\
$aws\
[](fg:color_yellow bg:color_blue)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$helm\
$kubernetes\
$conda\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

# Rendered per theme from the palette .env. Themes live in ~/.config/theme/palettes.
# Do not edit the generated copy.
#
# starship re-reads its config on every prompt, and STARSHIP_CONFIG (set in
# dot_zshrc.tmpl) points through ~/.config/theme/current -- so a switch lands on
# the next prompt in every shell, with no signal from theme-switch.
#
# `${count}` and friends below are starship's own variables, not palette keys.
# The render script passes envsubst an explicit list, so they survive.
palette = 'selenized'

[palettes.selenized]
# Text on the bright accent segments. bg_0 is the maximum-contrast counterpart
# to the accents in both polarities: dark text on bright chips in the dark
# theme, light text on saturated chips in the light one.
color_fg0 = '${bg_0}'
# Text on the neutral bg1/bg3 segments, where bg_0 would be invisible.
color_fg_dim = '${fg_1}'
color_bg1 = '${bg_1}'
color_bg3 = '${bg_2}'
color_blue = '${blue}'
color_aqua = '${cyan}'
color_green = '${green}'
color_orange = '${orange}'
color_purple = '${violet}'
color_red = '${red}'
color_yellow = '${yellow}'

[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\])]($style)'
style = "fg:color_fg0 bg:color_yellow"
symbol = '☁️ '
disabled = false
force_display = false

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[jobs]
style = "bg:color_orange fg:color_fg0"
format = '[ $symbol$number]($style)'
number_threshold = 1

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
style = "fg:color_red bg:color_aqua"
format = '[--\($state( $progress_current of $progress_total)\)--]($style)'

[git_status]
style = "fg:color_red bg:color_aqua"
format = '([$all_status$ahead_behind]($style))'

conflicted = "✗ "
ahead = "↑×${count} "
behind = "↓×${count} "
diverged = "⇄ ↑×${ahead_count} ↓×${behind_count} "
untracked = "??×${count} "
stashed = "📥 "
modified = "✎ ×${count} "
staged = "▣×${count} "
renamed = "↪ ×${count} "
deleted = "🗑️×${count} "

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_fg_dim bg:color_bg3)]($style)'

[helm]
format = '[⎈ $version](bold white) '

[kubernetes]
format = '[☸  ($user on )($cluster in )$context \($namespace\)](dimmed green) '
disabled = false

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_fg_dim bg:color_bg3)]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg_dim bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = "[❌](bold fg:color_red) "
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

