# Package manifest for Arch. chezmoi auto-loads everything under .chezmoidata/
# into the template context as top-level keys (`.packages`, `.machines`,
# `.apt` from apt.yaml).
#
#   packages.core     installed by .chezmoiscripts/run_onchange_before_{10-pacman,30-paru}-installs.sh.tmpl
#                     on every apply. Keep this to what the Hyprland session and
#                     chezmoi's own scripts need.
#   packages.optional never installed automatically. Pick from them with
#                     `pkgpick` (dot_local/bin/executable_pkgpick), which also
#                     handles removal and drift detection (`pkgpick --drift`).
#
# Group names under core/optional are free-form; optional groups are shown in
# the picker. Profile-specific core groups are selected via `profiles:` keyed
# by `.machine`, which `chezmoi init` asks for (see .chezmoi.toml.tmpl).
#
# Notes:
#   - Fast-moving CLIs are managed by mise (see dot_config/mise/config.toml):
#     node, npm, terraform, helm, kubectl, argocd, direnv, opencode, age, sops,
#     uv, gh, neovim (Debian only), shellcheck, bat, yq, atuin.
#   - `tree-sitter-cli` is intentionally NOT in mise — the prebuilt binary
#     requires a recent glibc. Pacman ships it; apt extensive builds it with cargo.

profiles:
  desktop: [grub, nvidia]
  laptop: [laptop]
  headless: []

packages:
  core:
    pacman:
      system:
        - base
        - linux
        - linux-firmware
        - intel-ucode # CPU microcode, kernel loads whichever matches the CPU
        - amd-ucode
        - networkmanager
        - sudo
        - reflector # mirrorlist updater
        - nftables # host firewall, run_onchange_after_install_nftables
        - snapper # btrfs snapshots, run_onchange_after_setup_snapper (no-op on ext4)
        - btrfs-progs # btrfs userspace tools, needed by snapper/snap-pac
        - snap-pac # pacman pre/post snapshot hook
        - ex-vi-compat # ex/vi symlinks to vim
      base:
        - vim
        - neovim
        - gettext # envsubst, for .chezmoiscripts/run_onchange_after_render_themes.sh
        - git
        - openssh
        - zsh
        - base-devel
        - less
        - man-db
        - wget
        - fzf
        - fd
        - ripgrep # rg, nvim grep picker
        - jq
        - starship # shell prompt
        - chezmoi
        - tmux
        - mise
        - usage # CLI spec tool, mise completions
        - pacman-contrib # pactree, for pkgpick removal checks
        - zip
        - unzip
        - 7zip
        - zoxide # smarter cd
        - atuin # shell history (dot_zshrc, run_onchange_import_atuin_history)
        - wl-clipboard # wl-copy / wl-paste
        - usbutils # lsusb
        - dosfstools # mkfs.fat / fsck.fat
        - fwupd # firmware updates via LVFS
        - btop # autostarted on workspace 99
        - openbsd-netcat # nc, walker socket in the launcher keybinding
        - figlet # ASCII banner text, sesh session scripts
        - xdg-user-dirs # ~/Desktop, ~/Downloads etc.
        - rsync # file sync/copy
        - man-pages # Linux man pages (man-db alone has none)
        - smartmontools # smartctl, disk health
        - nvme-cli # NVMe health and firmware
        - qt5-wayland # Wayland backend for leftover Qt5 apps
        - linux-headers # needed by any DKMS module
      hyprland:
        - hyprland
        - uwsm # universal wayland session manager, runs hyprland under systemd
        - hypridle # idle daemon (lock/dpms timers)
        - quickshell # QML shell: bar, notifications, OSD, lock
        - hyprpolkitagent # polkit auth prompts
        - greetd # login manager (see run_onchange_after_install_greetd)
        - greetd-tuigreet # plain TUI greeter for greetd
        - breeze-cursors # cursor theme, referenced by gtk-3.0/gtk-4.0 settings.ini
        - breeze-icons # icon theme, same
        - xdg-desktop-portal-hyprland # screen sharing portal
        - xdg-desktop-portal-gtk # file picker portal
        - gnome-keyring # secret storage for apps
        - libsecret # client lib for gnome-keyring
        - ghostty
        - grim # Wayland screenshots
        - slurp # region selector for grim
        - swappy # screenshot annotation editor
        - brightnessctl # backlight control CLI
        - playerctl # media keys (XF86Audio* keybindings)
        - network-manager-applet # nm-applet / nm-connection-editor
      audio:
        - pipewire
        - pipewire-alsa
        - pipewire-pulse
        - pipewire-jack # JACK API compatibility
        - pipewire-zeroconf # mDNS audio device discovery
        - wireplumber # pipewire session manager
        - alsa-utils # alsamixer, aplay
        - pulsemixer # pipewire/pulse TUI mixer (tui-launcher)
        - bluez
        - bluez-utils # bluetoothctl
      fonts:
        - ttf-jetbrains-mono-nerd
        - ttf-firacode-nerd # ghostty font, first monospace preference in fontconfig
        - ttf-nerd-fonts-symbols # symbols-only nerd font fallback
        - ttf-dejavu
        - noto-fonts-emoji
      grub: # desktop only; the laptop boots with systemd-boot (archinstall)
        - grub
        - efibootmgr
        - os-prober # detect other OSes for grub
        - grub-btrfs # boot snapper snapshots from the GRUB menu
      nvidia: # desktop only; open kernel modules for the RTX GPU
        - nvidia-open
        - nvtop # GPU process monitor
        - nvidia-settings # NVIDIA control panel
      laptop:
        - sof-firmware # Intel Sound Open Firmware audio
        - iio-sensor-proxy # accelerometer/ambient light sensors
        - fprintd # fingerprint reader
        - power-profiles-daemon # power profile switching
        - powertop # power consumption diagnostics
        - acpi # battery/thermal status CLI
        - thermald # Intel thermal daemon
    paru:
      desktop:
        - walker # app launcher
        - elephant # provider backend for walker
        - elephant-desktopapplications
        - elephant-windows
        - elephant-calc
        - elephant-symbols
        - elephant-providerlist # provider picker for walker
        - elephant-bluetooth
        - elephant-clipboard
        - elephant-files
        - elephant-menus # custom menus (sessions picker, dot_config/elephant/menus)
        - kanata # keyboard remapper
        - sesh-bin # tmux session manager
        - bluetuith # bluetooth TUI (tui-launcher)
        - wifitui # wifi TUI (tui-launcher)
        - pacsea-bin # package browser TUI (tui-launcher)
        - paru # AUR helper, bootstrapped by run_once_before_20-install-paru.sh

  optional:
    pacman:
      developer:
        - postgresql
        - apache # httpd
        - ansible
        - bind # dig, host, nslookup (provides dnsutils)
        - television # fuzzy finder TUI (tv)
        - tree-sitter-cli # parser generator, nvim-treesitter
        - trivy # container/IaC vulnerability scanner
        - gitleaks # git secret scanner
        - worktrunk # git worktree manager for parallel agents
        - openai-codex # OpenAI Codex CLI coding agent; no self-updater
        - luarocks # lua package manager
        - cmake
        - podman
        - podman-desktop
        - docker
        - docker-compose
        - docker-buildx
        - qemu-full # VM emulator with all targets
        - ollama # local LLM runner
        - ollama-cuda # CUDA backend for ollama (nvidia)
      apps:
        - firefox-developer-edition
        - chromium
        - obsidian
        - libreoffice-fresh
        - spotify-launcher # downloads/updates the spotify client
        - obs-studio
        - gimp # raster image editor
        - inkscape # vector graphics editor
        - tailscale # mesh VPN
        - proton-vpn-gtk-app
        - proton-vpn-cli
        - flatpak
        - steam
        - lutris # game launcher (wine/proton/emulators)
        - signal-desktop
        - vlc
        - vlc-plugin-ffmpeg
        - pavucontrol # pipewire/pulse GUI mixer
        - kdenlive # video editor
        - audacity # audio editor
        - mediainfo # media file metadata
        - telegram-desktop
      tools:
        - htop
        - tldr
        - trash-cli # trash-put etc., rm alternative
        - cups
        - cups-pdf # print-to-PDF backend
        - ntfsprogs # NTFS filesystem tools
        - ntfs-3g # NTFS FUSE driver
        - wimlib # Windows WIM image tools
        - android-tools # adb, fastboot
        - nwg-displays # GUI monitor layout editor
        - chrony # NTP daemon; replaces systemd-timesyncd where enabled by hand
        - arch-audit # CVEs against installed packages
        - lostfiles # find files not owned by any package
        - btrfs-assistant # GUI for snapper and btrfs subvolumes
        - gparted # partition editor GUI
        - nmap # port scanner
        - tcpdump # packet capture
        - wireshark-qt # packet analyzer GUI
        - mtr # traceroute + ping
        - whois
        - iperf3 # network throughput testing
        - sshfs # mount remote dirs over SSH
      intel-gpu:
        - vulkan-intel # Vulkan ICD for Intel iGPU; without it vulkan-icd-loader finds no device
        - vulkan-tools # vulkaninfo, to verify the ICD
        - intel-media-driver # VA-API backend for Intel Gen8+ (hardware video decode in chromium/vlc/ffmpeg)
        - libva-utils # vainfo, to verify VA-API
        - intel-gpu-tools # intel_gpu_top
      fonts:
        - ttf-fira-code
        - ttf-fira-mono
        - ttf-jetbrains-mono
        - ttf-roboto-mono
        - ttf-bitstream-vera
        - ttf-input-nerd
        - ttf-nerd-fonts-symbols-mono
        - noto-fonts # base Noto; without it non-Latin text renders as boxes
        - noto-fonts-cjk # Chinese/Japanese/Korean
        - inter-font # UI font
        - otf-font-awesome # icon font
        - hunspell-en_us # spell check dictionary
        - hunspell-de # spell check dictionary
      kde:
        - ark # archive manager
        - isoimagewriter # USB image writer
        - kcalc # calculator
        - dolphin # file manager
        - dolphin-plugins
        - archlinux-xdg-menu # app menus for dolphin open-with
        - okular # PDF/document viewer
        - system-config-printer # printer setup GUI
      security:
        - keepassxc # password manager
        - yubikey-manager # ykman
        - pam-u2f # FIDO2 keys for PAM login/sudo
        - libfido2 # FIDO2 tooling (fido2-token)
      virtualization:
        - virt-manager # VM GUI
        - libvirt # VM management daemon
        - dnsmasq # NAT networking for libvirt
        - distrobox # containers as distros
    paru:
      apps:
        - google-chrome
        - zen-browser-bin
        - insync # google drive sync client
        - visual-studio-code-bin
        - appimagelauncher # AppImage desktop integration
        - proton-mail-bin
        - portmaster-bin # application firewall
        - betterbird-bin # thunderbird fork
        - jetbrains-toolbox
        - openshot-bin # video editor
        - ventoy-bin # multi-ISO bootable USB
        - slack-desktop # Slack, official build repackaged
      developer:
        - x11docker # run GUI apps in docker
        - nats-cclient-git # NATS C client library
        - python-fastmcp-slim # FastMCP, MCP servers in python
        - docker-sbx-bin # docker sandboxes (sbx) for AI agents; versioned tarball, unlike docker-sbx
        - headlamp-bin # kubernetes manage gui
        - semgrep-bin # static analysis
        - bruno-bin # API client (postman alternative)
        - stably-orca-bin # Orca agentic coding IDE; CLI symlinked as ~/.local/bin/orca-ide
        - claude-code # Claude Code CLI; /usr/bin wrapper sets DISABLE_UPDATES=1, pacman owns updates
        - choosenim # nim toolchain installer
        - coder-bin # coder.com remote dev env CLI
        - podman-tui-bin # podman TUI
