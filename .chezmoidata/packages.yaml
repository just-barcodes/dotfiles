# Package manifest consumed by .chezmoiscripts/run_onchange_*_installs.sh.tmpl.
# chezmoi auto-loads everything under .chezmoidata/ into the template context as
# top-level keys (here: `.packages.pacman.*`, `.packages.paru`, `.machines`).
#
# Notes:
#   - Fast-moving CLIs are managed by mise (see dot_config/mise/config.toml),
#     not apt/pacman, so they stay current on LTS distros: node, npm, terraform,
#     helm, kubectl, argocd, direnv, opencode, age, sops, uv, gh, neovim,
#     shellcheck, bat, yq, atuin.
#   - `tree-sitter-cli` is intentionally NOT in mise — the prebuilt binary
#     requires a recent glibc and breaks on older LTS distros. Pacman ships
#     `tree-sitter-cli`; on apt extensive we `cargo install` it from source
#     so it links the local glibc.
#   - Per-machine extras are selected via `machines:` below, keyed by
#     `.chezmoi.hostname`. Each entry lists which `packages.pacman.*` groups
#     to merge in addition to the always-on sets.

machines:
  samPC: [pc]
  samTPLinux: [laptop]

packages:
  # Debian/Ubuntu packages. `minimal` always installs; `extensive` only when
  # `aptExtensive = true` is set in ~/.config/chezmoi/chezmoi.toml [data].
  apt:
    minimal:
      - vim
      - git
      - zsh
      - fonts-powerline
      - curl
      - tmux
      - htop
      - fzf
      - fd-find # binary is `fdfind`; alias in .zshrc if desired
      - ripgrep
      - jq
      - build-essential

    extensive:
      # repo / install foundations (also used by the mise repo setup step)
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - apt-transport-https

      # runtime/tool manager — installed from the mise apt repo (script adds it)
      - mise

      # dev tools (neovim, gh, shellcheck, bat, yq live in mise - see above)
      - git-lfs
      - tig
      - tldr
      - tree
      - httpie
      - ncdu
      - entr
      - moreutils
      - pv
      - rsync
      - file
      - universal-ctags
      - pipx

      # network / diagnostics
      - iputils-ping
      - iproute2
      - dnsutils
      - whois
      - mtr-tiny
      - traceroute
      - lsof
      - strace
      - net-tools

      # archives
      - unzip
      - zip
      - xz-utils

      # build toolchain (build-essential is in minimal)
      - cmake
      - pkg-config
      - autoconf
      - automake
      - libtool

      # python
      - python3-pip
      - python3-venv
      - python3-dev

      # common build deps for language toolchains (pyenv / ruby-build / node-from-source)
      - libssl-dev
      - libffi-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev

      # libclang is required to build tree-sitter-cli (rquickjs-sys uses bindgen)
      - libclang-dev

      # database clients
      - postgresql-client
      - default-mysql-client
      - sqlite3
      - redis-tools

  pacman:
    system:
      - vim
      - git
      - openssh
      - zsh
      - gcc
      - wl-clipboard
      - grim
      - slurp
      - swappy
      - base-devel
      - less
      - man-db
      - tldr
      - alsa-utils
      - fzf
      - usbutils
      - network-manager-applet
      - fd
      - cups
      - cups-pdf
      - qemu-full
      - ntp
      - fwupd
      - dosfstools
      - ntfsprogs
      - brightnessctl
      - pamixer
      - pavucontrol
      - btop
      - figlet
