      - brightnessctl
      - pamixer
      - pavucontrol
      - btop
      - figlet
      - pulsemixer
      - openbsd-netcat
      - bluez
      - bluez-utils
      - pipewire
      - pipewire-alsa
      - pipewire-pulse
      - pipewire-jack
      - pipewire-zeroconf
      - wireplumber
      - chrony
