# Package manifest for Arch. chezmoi auto-loads everything under .chezmoidata/
# into the template context as top-level keys (`.packages`, `.machines`,
# `.apt` from apt.yaml).
#
#   packages.core     installed by .chezmoiscripts/run_onchange_{pacman,paru}_installs.sh.tmpl
#                     on every apply. Keep this to what the Hyprland session and
#                     chezmoi's own scripts need.
#   packages.optional never installed automatically. Pick from them with
#                     `pkgpick` (dot_local/bin/executable_pkgpick), which also
#                     handles removal and drift detection (`pkgpick --drift`).
#
# Group names under core/optional are free-form; optional groups are shown in
# the picker. Machine-specific core groups are selected via `machines:` keyed
# by `.chezmoi.hostname`.
#
# Notes:
#   - Fast-moving CLIs are managed by mise (see dot_config/mise/config.toml):
#     node, npm, terraform, helm, kubectl, argocd, direnv, opencode, age, sops,
#     uv, gh, neovim (Debian only), shellcheck, bat, yq, atuin.
#   - `tree-sitter-cli` is intentionally NOT in mise — the prebuilt binary
#     requires a recent glibc. Pacman ships it; apt extensive builds it with cargo.

machines:
  samPC: [pc]
  samTPLinux: [laptop]

packages:
  core:
    pacman:
      base:
        - vim
        - neovim
        - gettext # envsubst, for .chezmoiscripts/run_onchange_after_render_themes.sh
        - git
        - openssh
        - zsh
        - gcc
        - base-devel
        - less
        - man-db
        - wget
        - fzf
        - fd
        - jq
        - starship # shell prompt
        - chezmoi
        - tmux
        - mise
        - usage # CLI spec tool, mise completions
        - pacman-contrib # pactree, for pkgpick removal checks
        - zip
        - unzip
        - wl-clipboard # wl-copy / wl-paste
        - usbutils # lsusb
        - dosfstools # mkfs.fat / fsck.fat
        - fwupd # firmware updates via LVFS
        - btop # autostarted on workspace 99
      hyprland:
        - hyprland
        - uwsm # universal wayland session manager, runs hyprland under systemd
        - hypridle # idle daemon (lock/dpms timers)
        - quickshell # QML shell: bar, notifications, OSD, lock
        - hyprpolkitagent # polkit auth prompts
        - xdg-desktop-portal-hyprland # screen sharing portal
        - xdg-desktop-portal-gtk # file picker portal
        - gnome-keyring # secret storage for apps
        - libsecret # client lib for gnome-keyring
        - ghostty
        - grim # Wayland screenshots
        - slurp # region selector for grim
        - swappy # screenshot annotation editor
        - brightnessctl # backlight control CLI
        - network-manager-applet # nm-applet / nm-connection-editor
        - nwg-displays # GUI monitor layout editor
      audio:
        - pipewire
        - pipewire-alsa
        - pipewire-pulse
        - pipewire-jack # JACK API compatibility
        - pipewire-zeroconf # mDNS audio device discovery
        - wireplumber # pipewire session manager
        - alsa-utils # alsamixer, aplay
        - pavucontrol # pipewire/pulse GUI mixer
        - pulsemixer # pipewire/pulse TUI mixer (tui-launcher)
        - bluez
        - bluez-utils # bluetoothctl
      fonts:
        - ttf-jetbrains-mono-nerd
        - ttf-nerd-fonts-symbols # symbols-only nerd font fallback
        - ttf-dejavu
        - noto-fonts-emoji
      laptop:
        - sof-firmware # Intel Sound Open Firmware audio
        - iio-sensor-proxy # accelerometer/ambient light sensors
        - fprintd # fingerprint reader
        - power-profiles-daemon # power profile switching
      pc:
        - steam
    paru:
      desktop:
        - walker # app launcher
        - elephant # provider backend for walker
        - elephant-desktopapplications
        - elephant-windows
        - elephant-calc
        - elephant-symbols
        - elephant-providerlist # provider picker for walker
        - elephant-bluetooth
        - elephant-clipboard
        - elephant-files
        - elephant-bitwarden
        - kanata # keyboard remapper
        - sesh-bin # tmux session manager
        - bluetuith # bluetooth TUI (tui-launcher)
        - wifitui # wifi TUI (tui-launcher)
        - pacsea-bin # package browser TUI (tui-launcher)

  optional:
    pacman:
      developer:
        - postgresql
        - apache # httpd
        - ansible
        - dnsutils
        - television # fuzzy finder TUI (tv)
        - tree-sitter-cli # parser generator, nvim-treesitter
        - trivy # container/IaC vulnerability scanner
        - gitleaks # git secret scanner
        - worktrunk # git worktree manager for parallel agents
        - luarocks # lua package manager
        - cmake
        - podman
        - podman-desktop
        - docker
        - docker-compose
        - docker-buildx
        - qemu-full # VM emulator with all targets
      apps:
        - firefox-developer-edition
        - chromium
        - obsidian
        - libreoffice-fresh
        - spotify-launcher # downloads/updates the spotify client
        - obs-studio
        - tailscale # mesh VPN
        - proton-vpn-gtk-app
        - proton-vpn-cli
        - flatpak
      tools:
        - htop
        - tldr
        - trash-cli # trash-put etc., rm alternative
        - figlet # ASCII banner text
        - openbsd-netcat # nc
        - cups
        - cups-pdf # print-to-PDF backend
        - ntfsprogs # NTFS filesystem tools
      fonts:
        - ttf-fira-code
        - ttf-fira-mono
        - ttf-jetbrains-mono
        - ttf-roboto-mono
        - ttf-bitstream-vera
        - ttf-input-nerd
        - ttf-firacode-nerd
        - nerd-fonts # meta package, all nerd fonts
      kde:
        - ark # archive manager
        - isoimagewriter # USB image writer
        - kcalc # calculator
        - dolphin # file manager
        - dolphin-plugins
        - archlinux-xdg-menu # app menus for dolphin open-with
        - okular # PDF/document viewer
        - system-config-printer # printer setup GUI
    paru:
      apps:
        - google-chrome
        - zen-browser-bin
        - insync # google drive sync client
        - visual-studio-code-bin
        - appimagelauncher # AppImage desktop integration
        - proton-mail-bin
        - portmaster-bin # application firewall
        - betterbird-bin # thunderbird fork
        - jetbrains-toolbox
        - openshot # video editor
      developer:
        - x11docker # run GUI apps in docker
        - headlamp-bin # kubernetes manage gui
        - semgrep-bin # static analysis
        - bruno-bin # API client (postman alternative)
        - choosenim # nim toolchain installer
        - coder # coder.com remote dev env CLI
        - podman-tui-bin # podman TUI

  npm_global:
    - "@anthropic-ai/claude-code"
    - "@earendil-works/pi-coding-agent" # pi coding agent CLI
    - pnpm
    - yarn
    - hunkdiff # terminal diff viewer for agent changesets
