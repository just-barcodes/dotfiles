# mise tools that are NOT installed automatically. Pick them with `misepick`
# (dot_local/bin/executable_misepick), which writes the chosen tools to
# ~/.config/mise/conf.d/optional.toml. chezmoi does not manage that file, so
# `chezmoi apply` neither adds nor removes them; `mise upgrade` on apply still
# keeps them current within their version spec.
#
# Always-installed tools live in dot_config/mise/config.toml. Renovate only
# bumps pins there, so prefer loose specs ("latest", major) in this file.
# Group names are free-form and shown in the picker. Backend prefixes such as
# "npm:" are part of the tool name.
mise:
  optional:
    build:
      task: "3.52.0"
      lefthook: latest
      go: latest
      hugo: latest
    kubernetes-cloud:
      kubectl: "1.36"
      helm: "4.2"
      argocd: "3.4.5"
      terraform: "1.15"
      cloudflared: "2026.6.1"
    developer:
      rust: "1.97.0"
      devcontainer-cli: latest # devcontainer-wrapper, tmux prefix+U
      opencode: "1.15"
      lazygit: "0.63.0" # nvim <leader>gl via snacks
      lazydocker: "0.25"
      yq: "4.53.3"
      direnv: "2.37" # zshrc hook is guarded
      uv: "0.11.28"
      gh: "2"
      shellcheck: "0.11.0"
      bat: "0.26.1" # television previews (optional pacman package)
      herdr: latest # agent workspace manager; theme-switch reloads it when running
    secrets:
      age: "1.3"
      sops: "3.13"
    npm:
      node: "22" # runtime for the npm: tools below, pick it with them
      "npm:@earendil-works/pi-coding-agent": latest # pi coding agent CLI
      "npm:pnpm": latest
      "npm:yarn": latest
      "npm:hunkdiff": latest # terminal diff viewer for agent changesets
